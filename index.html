  <body class="bg-[#0f1115] text-[#f3f4f6] antialiased overflow-hidden select-none">
    <div id="root"></div>
    <div id="boot-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0c10;color:#e5e7eb;font-family:system-ui,sans-serif;font-size:15px;text-align:center;padding:24px;z-index:99">טוען את ISROAD'S…</div>
    <div id="build-tag" style="position:fixed;top:1px;left:6px;z-index:5;font:9px system-ui,sans-serif;color:rgba(255,255,255,.5);pointer-events:none">גרסה 16 · 24.09</div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>window.maplibregl||document.write('<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>')</script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script>window.turf||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"><\/script>')</script>
    <script>
      (function () {
        var m = [];
        if (!window.maplibregl) m.push('ספריית המפה (MapLibre)');
        if (!window.turf) m.push('ספריית החישובים (Turf)');
        if (m.length) {
          document.getElementById('boot-msg').innerHTML = 'לא הצלחתי לטעון: ' + m.join(', ') + '.<br><br>בדוק חיבור אינטרנט. אחרי טעינה אחת מוצלחת האפליקציה נשמרת ועובדת גם בלי קליטה.';
          window.__bootFailed = true;
        }
      })();
    </script>
    <script src="app.2b4a122c7b.js"></script>
    <script>
      (function () {
        if (window.__bootFailed) return;
        var tries = 0;
        var t = setInterval(function () {
          var root = document.getElementById('root'), b = document.getElementById('boot-msg');
          if (root && root.childNodes.length) { if (b) b.remove(); clearInterval(t); }
          else if (++tries > 40 && b) { b.innerHTML = 'האפליקציה לא הצליחה לעלות. רענן את הדף.'; clearInterval(t); }
        }, 100);
        window.addEventListener('error', function (e) { var b = document.getElementById('boot-msg'); if (b) b.textContent = 'שגיאה: ' + (e.message || e); });
      })();
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }
    </script>
